[pytest]
addopts = --import-mode=importlib
pythonpath = . pesaguard_backend_pipeline pesaguard_backend_pipeline/tests
markers =
    integration: marks tests that require live external services or a staging environment.
    slow: marks tests that are intentionally slow or resource-intensive.
filterwarnings =
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:DeprecationWarning
    ignore:starlette\.middleware\.wsgi is deprecated.*:DeprecationWarning
    ignore:Passing a string or function for `on_failure` is deprecated.*:DeprecationWarning
