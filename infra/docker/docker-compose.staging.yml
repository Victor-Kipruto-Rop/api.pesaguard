# Data residency (Addendum III): keep DEPLOYMENT_REGION, BACKUP_REGION, and LOG_REGION
# consistent with docs/product/DATA_RESIDENCY.md. Pilot default is ke-1 (Kenya / East Africa).

x-residency-env: &residency-env
  DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-ke-1}
  BACKUP_REGION: ${BACKUP_REGION:-ke-1}
  LOG_REGION: ${LOG_REGION:-ke-1}

services:
  postgres-staging:
    image: postgres:16
    environment:
      <<: *residency-env
      POSTGRES_DB: ${STAGING_POSTGRES_DB:?STAGING_POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  kafka-staging:
    image: bitnami/kafka:3.7
    environment:
      <<: *residency-env
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: ${STAGING_KAFKA_ADVERTISED_LISTENERS:?STAGING_KAFKA_ADVERTISED_LISTENERS must be set}
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-staging:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - staging_kafka_data:/bitnami/kafka
  redis-staging:
    image: redis:7
    environment:
      <<: *residency-env
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - staging_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  staging_pgdata:
  staging_kafka_data:
  staging_redis_data:
