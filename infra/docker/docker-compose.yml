# Data residency (Addendum III): set DEPLOYMENT_REGION, BACKUP_REGION, and LOG_REGION
# to the chosen hosting jurisdiction before go-live. See docs/product/DATA_RESIDENCY.md.
# Pilot default: ke-1 (Kenya / East Africa). Backups must stay in BACKUP_REGION.

x-residency-env: &residency-env
  DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:-ke-1}
  BACKUP_REGION: ${BACKUP_REGION:-ke-1}
  LOG_REGION: ${LOG_REGION:-ke-1}

x-observability-env: &observability-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel_collector:4317}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-grpc}
  OTEL_EXPORTER_OTLP_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT:-5}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-pesaguard}
  OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-1.0.0}
  OTEL_DEPLOYMENT_ENVIRONMENT: ${OTEL_DEPLOYMENT_ENVIRONMENT:-production}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.10}
  PESAGUARD_SHARED_METRICS: ${PESAGUARD_SHARED_METRICS:-1}
  PROMETHEUS_MULTIPROC_DIR: /tmp/pesaguard-prometheus
  KAFKA_LAG_TOPICS: ${KAFKA_LAG_TOPICS:-pesaguard.transactions.raw,pesaguard.reconciliation.exceptions,pesaguard.notifications.requested}
  KAFKA_LAG_GROUPS: ${KAFKA_LAG_GROUPS:-reconciliation,communications}
  PESAGUARD_ALERTMANAGER_WEBHOOK_SECRET: ${PESAGUARD_ALERTMANAGER_WEBHOOK_SECRET:-}
  PYTHONPATH: /app:/app/pesaguard_backend_pipeline

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ../../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    depends_on:
      - webhook_receiver

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    restart: unless-stopped

  otel_collector:
    image: otel/opentelemetry-collector:0.120.0
    command: ["--config=/etc/otel-collector.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    volumes:
      - ../../monitoring/otel-collector.yaml:/etc/otel-collector.yaml:ro
    depends_on:
      - jaeger
    restart: unless-stopped

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.2
    container_name: pesaguard-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,PLAINTEXT://localhost:19092
      - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr=PLAINTEXT://redpanda:8082
    ports:
      - "127.0.0.1:19092:19092"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:9644:9644"
    environment:
      <<: *residency-env
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  postgres:
    image: postgres:16
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=60s
      - -c
      - archive_command=${POSTGRES_ARCHIVE_COMMAND:-test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f}
    environment:
      <<: *residency-env
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal_archive:/var/lib/postgresql/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  webhook_receiver:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["python", "pesaguard_backend_pipeline/app.py"]
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      REDIS_URL: ${REDIS_URL_DOCKER:?REDIS_URL_DOCKER must be set}
      PESAGUARD_API_URL: ${PESAGUARD_API_URL:?PESAGUARD_API_URL must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      PESAGUARD_BIND_HOST: ${PESAGUARD_BIND_HOST_DOCKER:?PESAGUARD_BIND_HOST_DOCKER must be set}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      PORT: "5000"
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  reconciliation_job:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["python", "pesaguard_backend_pipeline/reconciliation_job.py"]
    healthcheck:
      disable: true
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      REDIS_URL: ${REDIS_URL_DOCKER:?REDIS_URL_DOCKER must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard_api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["uvicorn", "pesaguard_backend_pipeline.fastapi_app:app", "--host", "0.0.0.0", "--port", "5001"]
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      REDIS_URL: ${REDIS_URL_DOCKER:?REDIS_URL_DOCKER must be set}
      PESAGUARD_API_URL: ${PESAGUARD_API_URL:?PESAGUARD_API_URL must be set}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  workflow_scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["python", "pesaguard_backend_pipeline/workflow_scheduler.py"]
    healthcheck:
      disable: true
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      PESAGUARD_WORKFLOW_SCHEDULER_INTERVAL_SECONDS: ${PESAGUARD_WORKFLOW_SCHEDULER_INTERVAL_SECONDS:-30}
      PESAGUARD_WORKFLOW_SCHEDULER_BATCH: ${PESAGUARD_WORKFLOW_SCHEDULER_BATCH:-100}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  rq_worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    command: ["/bin/sh", "pesaguard_backend_pipeline/worker_entrypoint.sh"]
    healthcheck:
      disable: true
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      REDIS_URL: ${REDIS_URL_DOCKER:?REDIS_URL_DOCKER must be set}
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-transaction_events}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  communications_worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    command: ["python", "-m", "pesaguard_backend_pipeline.communications.worker"]
    env_file:
      - ${PESAGUARD_COMPOSE_ENV_FILE:-../../.env}
    environment:
      <<: [*residency-env, *observability-env]
      DATABASE_URL: ${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set}
      REDIS_URL: ${REDIS_URL_DOCKER:?REDIS_URL_DOCKER must be set}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS_DOCKER:?KAFKA_BOOTSTRAP_SERVERS_DOCKER must be set}
      PESAGUARD_NOTIFICATION_TOPIC: ${PESAGUARD_NOTIFICATION_TOPIC:-pesaguard.notifications.requested}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-0.0}
      SENTRY_SEND_DEFAULT_PII: ${SENTRY_SEND_DEFAULT_PII:-false}
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  wal_archive:
  redisdata:
  redpanda_data:
