name: PesaGuard Release

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      promote_production:
        description: "Request production promotion after staging verification"
        required: true
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify code and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pesaguard
          POSTGRES_PASSWORD: pesaguard
          POSTGRES_DB: pesaguard_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pesaguard_backend_pipeline/requirements-dev.txt
          pip install alembic
      - name: Compile Python modules
        run: python -m compileall -q pesaguard_backend_pipeline
      - name: Check fatal lint errors and undefined names
        run: ruff check --select E9,F821 .
      - name: Validate migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_ci
          PYTHONPATH: .
          JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-bytes
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_ci
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
          DARAJA_SHARED_SECRET: ci-daraja-secret
          JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-bytes
        run: pytest -v --tb=short --durations=10

  publish:
    name: Build, scan, and publish image
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}
          build-args: |
            PESAGUARD_BUILD_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  staging:
    name: Deploy staging and smoke test
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check staging deployment and migration secrets
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.STAGING_JWT_SECRET_KEY }}
          PROVIDER_ENCRYPTION_KEY: ${{ secrets.PROVIDER_ENCRYPTION_KEY }}
          PESAGUARD_PAYLOAD_ENCRYPTION_KEY: ${{ secrets.PESAGUARD_PAYLOAD_ENCRYPTION_KEY }}
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
        shell: bash
        run: |
          missing=0
          for name in DATABASE_URL JWT_SECRET_KEY PROVIDER_ENCRYPTION_KEY \
            PESAGUARD_PAYLOAD_ENCRYPTION_KEY DEPLOY_HOOK_URL HEALTH_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing staging configuration::$name is required in the staging GitHub environment"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pesaguard_backend_pipeline/requirements.txt
      - name: Install migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pesaguard_backend_pipeline/requirements.txt
          pip install alembic
      - name: Apply reviewed Alembic migrations to staging
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.STAGING_JWT_SECRET_KEY }}
          PROVIDER_ENCRYPTION_KEY: ${{ secrets.PROVIDER_ENCRYPTION_KEY }}
          PESAGUARD_PAYLOAD_ENCRYPTION_KEY: ${{ secrets.PESAGUARD_PAYLOAD_ENCRYPTION_KEY }}
          PESAGUARD_ENVIRONMENT: staging
          PYTHONPATH: .
        run: alembic upgrade head
      - name: Deploy the scanned image digest to staging
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "RENDER_STAGING_DEPLOY_HOOK is required"; exit 1; }
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --get --data-urlencode "imgURL=$IMAGE_REF" "$DEPLOY_HOOK_URL")"
          deploy_id="$(jq -r '.deploy.id // empty' <<< "$response")"
          test -n "$deploy_id" || { echo "Render did not return a staging deployment ID"; exit 1; }
          echo "Started staging deployment $deploy_id for the scanned image digest"
      - name: Wait for staging readiness at this revision
        env:
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test -n "$HEALTH_URL" || { echo "STAGING_HEALTH_URL is required"; exit 1; }
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$HEALTH_URL" 2>&1)"; then
              if python -c 'import json,os,sys; payload=json.load(sys.stdin); sys.exit(0 if payload.get("status") == "ok" and payload.get("release") == os.environ["EXPECTED_REVISION"] else 1)' <<< "$response"; then
                echo "Staging is ready at revision $EXPECTED_REVISION"
                exit 0
              fi
              echo "Staging is responding but has not reported the expected healthy revision"
            else
              echo "Staging health request failed"
            fi
            sleep 10
          done
          echo "Staging did not become healthy"; exit 1

  production:
    name: Promote the staging-verified image to production
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.promote_production
    needs: [publish, staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the same scanned image digest to production
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "RENDER_PRODUCTION_DEPLOY_HOOK is required"; exit 1; }
          response="$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            --get --data-urlencode "imgURL=$IMAGE_REF" "$DEPLOY_HOOK_URL")"
          deploy_id="$(jq -r '.deploy.id // empty' <<< "$response")"
          test -n "$deploy_id" || { echo "Render did not return a production deployment ID"; exit 1; }
          echo "Started production deployment $deploy_id for the staging-verified image digest"
      - name: Verify production health at this revision
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test -n "$HEALTH_URL" || { echo "PRODUCTION_HEALTH_URL is required"; exit 1; }
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 10 "$HEALTH_URL" 2>&1)"; then
              if python -c 'import json,os,sys; payload=json.load(sys.stdin); sys.exit(0 if payload.get("status") == "ok" and payload.get("release") == os.environ["EXPECTED_REVISION"] else 1)' <<< "$response"; then
                echo "Production is healthy at revision $EXPECTED_REVISION"
                exit 0
              fi
              echo "Production is responding but has not reported the expected healthy revision"
            else
              echo "Production health request failed"
            fi
            sleep 10
          done
          echo "Production did not become ready"; exit 1

  integration:
    uses: ./.github/workflows/integration-services.yml
