name: PesaGuard Release

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: Verify code and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pesaguard
          POSTGRES_PASSWORD: pesaguard
          POSTGRES_DB: pesaguard_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pesaguard_backend_pipeline/requirements-dev.txt
          pip install alembic
      - name: Compile Python modules
        run: python -m compileall -q pesaguard_backend_pipeline
      - name: Validate migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_ci
          PYTHONPATH: .
          JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-bytes
        run: alembic upgrade head
      - name: Run tests
        env:
          DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_ci
          REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: .
          DARAJA_SHARED_SECRET: ci-daraja-secret
          PESAGUARD_ALLOW_UNRESTRICTED_WEBHOOK_SOURCE: "1"
          JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-bytes
        run: pytest -v --tb=short --durations=10

  publish:
    name: Build, scan, and publish image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.sha }}
            ${{ steps.image.outputs.image }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  staging:
    name: Deploy staging and smoke test
    if: github.ref == 'refs/heads/staging'
    needs: publish
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger staging deployment with image digest
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "RENDER_STAGING_DEPLOY_HOOK is required"; exit 1; }
          curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK_URL" \
            -H 'Content-Type: application/json' --data "{\"image\":\"$IMAGE_REF\"}"
      - name: Wait for staging liveness
        env:
          HEALTH_URL: ${{ secrets.STAGING_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo "STAGING_HEALTH_URL is required"; exit 1; }
          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" || true)
            if [ -n "$response" ] && python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("status") in ("ok", "alive") else 1)' <<< "$response"; then
              exit 0
            fi
            sleep 10
          done
          echo "Staging did not become healthy"; exit 1

  production:
    name: Promote production
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger production deployment with image digest
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
          IMAGE_REF: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          test -n "$DEPLOY_HOOK_URL" || { echo "RENDER_PRODUCTION_DEPLOY_HOOK is required"; exit 1; }
          curl --fail --silent --show-error --retry 3 -X POST "$DEPLOY_HOOK_URL" \
            -H 'Content-Type: application/json' --data "{\"image\":\"$IMAGE_REF\"}"
      - name: Wait for production readiness
        env:
          HEALTH_URL: ${{ secrets.PRODUCTION_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo "PRODUCTION_HEALTH_URL is required"; exit 1; }
          for attempt in $(seq 1 30); do
            response=$(curl --fail --silent --show-error --max-time 10 "$HEALTH_URL" || true)
            if [ -n "$response" ] && python -c 'import json,sys; payload=json.load(sys.stdin); sys.exit(0 if payload.get("status") == "ok" else 1)' <<< "$response"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not become ready"; exit 1
