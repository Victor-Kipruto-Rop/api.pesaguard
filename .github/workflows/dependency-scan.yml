name: Dependency and Security Scan

permissions:
  contents: read

on:
  pull_request:
    branches: [ main, staging ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sundays

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-security-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-security-

      - name: Install security scanning tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit safety

      - name: Audit Python packages for CVEs (pip-audit)
        run: |
          if [ -f pesaguard_backend_pipeline/requirements-dev.txt ]; then
            pip-audit -r pesaguard_backend_pipeline/requirements-dev.txt --desc
          elif [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc
          elif [ -f pesaguard_backend_pipeline/requirements.txt ]; then
            pip-audit -r pesaguard_backend_pipeline/requirements.txt --desc
          else
            pip-audit --desc
          fi

      - name: Scan Python code for security flaws (bandit)
        run: |
          TARGET_DIR="."
          if [ -d "pesaguard_backend_pipeline" ]; then
            TARGET_DIR="pesaguard_backend_pipeline"
          fi
          bandit -r "$TARGET_DIR" -ll -ii -f json -o bandit-report.json || true
          bandit -r "$TARGET_DIR" -ll -ii -f txt

      - name: Check database & library safety (safety)
        run: safety check --json

      - name: Upload Bandit Security Report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json
        continue-on-error: false

  frontend-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-security-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-security-

      - name: Install frontend dependencies
        run: |
          if [ -f frontend/package.json ]; then
            npm --prefix frontend ci --omit=optional
          fi

      - name: Audit npm packages (moderate severity threshold)
        run: |
          if [ -f frontend/package.json ]; then
            npm --prefix frontend audit --audit-level=moderate
          fi
        continue-on-error: false

      - name: Check production vulnerabilities (npm audit json)
        run: |
          if [ -f frontend/package.json ]; then
            npm --prefix frontend audit --omit=dev --json
          fi
