name: PesaGuard service integration tests

on:
  workflow_call:

jobs:
  integration:
    name: PostgreSQL, Redis, and Kafka-compatible broker
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: pesaguard
          POSTGRES_PASSWORD: pesaguard
          POSTGRES_DB: pesaguard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pesaguard_backend_pipeline/requirements-dev.txt
          pip install alembic

      - name: Start isolated Redpanda broker
        run: |
          docker run --detach --name pesaguard-redpanda --publish 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v25.2.2 \
            redpanda start --overprovisioned --smp=1 --memory=1G \
            --reserve-memory=0M --node-id=0 --check=false \
            --kafka-addr=PLAINTEXT://0.0.0.0:9092 \
            --advertise-kafka-addr=PLAINTEXT://localhost:9092
          for attempt in $(seq 1 60); do
            if docker exec pesaguard-redpanda rpk cluster health --exit-when-healthy >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs pesaguard-redpanda
          exit 1

      - name: Apply PostgreSQL migrations
        env:
          DATABASE_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_test
          JWT_SECRET_KEY: ci-jwt-secret-key-with-at-least-32-bytes
          PYTHON_DOTENV_DISABLED: "1"
        run: alembic upgrade head

      - name: Verify PostgreSQL idempotency and concurrency
        env:
          PESAGUARD_POSTGRES_TEST_URL: postgresql://pesaguard:pesaguard@localhost:5432/pesaguard_test
          PESAGUARD_RUN_POSTGRES_INTEGRATION: "1"
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONPATH: .
        run: pytest -q pesaguard_backend_pipeline/tests/test_postgres_concurrency.py

      - name: Verify shared Redis rate-limit state
        env:
          PESAGUARD_RUN_REDIS_INTEGRATION: "1"
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/15
        run: >-
          pytest -q
          pesaguard_backend_pipeline/tests/test_security_event_instrumentation.py
          -k redis_rate_limit_state_is_shared_across_instances

      - name: Verify broker-derived Kafka lag
        env:
          PESAGUARD_LIVE_E2E: "1"
          PESAGUARD_LIVE_KAFKA_BOOTSTRAP: localhost:9092
          PYTHON_DOTENV_DISABLED: "1"
          PYTHONPATH: .
        run: pytest -q pesaguard_backend_pipeline/tests/test_kafka_lag_live.py
