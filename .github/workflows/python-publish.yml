name: Upload Python Package to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test-before-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytest==8.3.4 Flask==3.1.0 SQLAlchemy==2.0.38 requests==2.32.3
          fi

      - name: Run test suite
        env:
          PYTHONPATH: .
          DARAJA_SHARED_SECRET: release_test_secret
          PESAGUARD_ALLOW_UNRESTRICTED_WEBHOOK_SOURCE: 1
        run: |
          pytest -v --tb=short

  release-build:
    runs-on: ubuntu-latest
    needs:
      - test-before-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing OIDC

    environment:
      name: pypi
      url: https://pypi.org/p/pesaguard-backend-pipeline

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist/

      - name: Publish package to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
