services:
  webhook_receiver:
    ports: []

  dashboard_api:
    ports: []

  nginx:
    image: nginx:1.27-alpine
    environment:
      API_SERVER_NAME: ${API_SERVER_NAME:?API_SERVER_NAME must be set}
      NGINX_ENVSUBST_FILTER: ^API_SERVER_NAME\b
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - dashboard_api
      - webhook_receiver
    ports:
      - "127.0.0.1:8080:8080"
    expose:
      - "8080"
