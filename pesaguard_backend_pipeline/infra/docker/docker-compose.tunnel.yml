services:
  nginx:
    image: nginx:1.27-alpine
    environment:
      API_SERVER_NAME: ${API_SERVER_NAME:?API_SERVER_NAME must be set}
      NGINX_ENVSUBST_FILTER: ^API_SERVER_NAME\b
    volumes:
      - ./nginx.conf:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - dashboard_api
      - webhook_receiver
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      nginx:
        condition: service_healthy
