# Template rendered by the official nginx entrypoint; preserve nginx runtime variables.
resolver 127.0.0.11 valid=30s;

upstream dashboard_api {
    server dashboard_api:5001;
}

upstream webhook_receiver {
    server webhook_receiver:5000;
}

server {
    listen 8080;
    server_name ${API_SERVER_NAME};

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;

    location /webhook/ {
        proxy_pass http://webhook_receiver;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://dashboard_api;
        proxy_http_version 1.1;
    }
}
